name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw "rustup failed: $LASTEXITCODE" }
      - name: Format
        run: |
          cargo +stable fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "fmt failed: $LASTEXITCODE" }
      - name: Clippy
        run: |
          cargo +stable clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy failed: $LASTEXITCODE" }
      - name: Tests
        run: |
          cargo +stable test --locked
          if ($LASTEXITCODE -ne 0) { throw "tests failed: $LASTEXITCODE" }
      - name: Release application
        run: |
          cargo +stable build --locked --release --bin wallpaperlive
          if ($LASTEXITCODE -ne 0) { throw "build failed: $LASTEXITCODE" }
          & .\scripts\Embed-Icon.ps1 -Executable .\target\release\wallpaperlive.exe
      - name: Delivery script syntax
        run: |
          foreach ($path in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Build installer
        run: |
          & .\scripts\Installer.ps1
          $installer = @(Get-ChildItem -LiteralPath .\dist -Filter 'wallpaperlivesetup-v*.exe' -File)
          if ($installer.Count -ne 1) { throw 'Expected exactly one versioned installer.' }
          $hash = (Get-FileHash -LiteralPath $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\SHA256SUMS.txt'), "$hash  $($installer[0].Name)`n", [Text.Encoding]::ASCII)
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallpaperlive-windows-x64
          path: |
            dist/wallpaperlivesetup-v*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wallpaperlive-windows-x64
          path: dist
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installerName = "wallpaperlivesetup-$env:RELEASE_TAG.exe"
          $installerPath = Join-Path .\dist $installerName
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "$hash  $installerName"
          if ((Get-Content -LiteralPath .\dist\SHA256SUMS.txt -Raw).Trim() -ne $expected) { throw 'Installer checksum mismatch.' }
          $changelog = Get-Content -LiteralPath .\CHANGELOG.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape($env:RELEASE_TAG) + '\r?$\s*(.*?)(?=^---\s*$|^## |\z)'
          $entry = [regex]::Match($changelog, $pattern)
          if (-not $entry.Success) { throw "Missing changelog for $env:RELEASE_TAG" }
          $changes = $entry.Groups[1].Value.Trim()
          $notes = @"
          ## WallpaperLive $env:RELEASE_TAG

          $changes

          ---

          ### Download and verification

          - [Windows x64 installer](https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/$installerName)
          - [SHA256SUMS.txt](https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/SHA256SUMS.txt)
          - [GitHub Actions build](https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID): formatting, Clippy, source tests, release compilation and installer build passed.

          **Installer SHA256:** ``$hash``

          ### Installation notes

          - Unsigned build. Keep Windows security protections enabled and use trusted local media.
          - Setup reuses a verified decoder or local archive; otherwise it asks before a one-time decoder download. No wallpapers or decoder binaries are bundled.
          - Setup can launch the app on completion, but does not apply a wallpaper or enable startup automatically. Installation and live desktop testing remain manual.
          "@
          $notes | Set-Content -LiteralPath .\dist\release-notes.md -Encoding utf8
          gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' > $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $installerPath '.\dist\SHA256SUMS.txt' --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $LASTEXITCODE" }
            gh release edit $env:RELEASE_TAG --draft=false --notes-file '.\dist\release-notes.md'
            if ($LASTEXITCODE -ne 0) { throw "Release update failed: $LASTEXITCODE" }
            exit 0
          }
          $arguments = @('release', 'create', $env:RELEASE_TAG, $installerPath, '.\dist\SHA256SUMS.txt', '--verify-tag', '--draft', '--title', "WallpaperLive $env:RELEASE_TAG", '--notes-file', '.\dist\release-notes.md')
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += @('--prerelease', '--latest=false') }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed: $LASTEXITCODE" }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed: $LASTEXITCODE" }
