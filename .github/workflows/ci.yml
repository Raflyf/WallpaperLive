name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw "rustup failed: $LASTEXITCODE" }
      - name: Format
        run: |
          cargo +stable fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "fmt failed: $LASTEXITCODE" }
      - name: Clippy
        run: |
          cargo +stable clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy failed: $LASTEXITCODE" }
      - name: Tests
        run: |
          cargo +stable test --locked
          if ($LASTEXITCODE -ne 0) { throw "tests failed: $LASTEXITCODE" }
      - name: Release application
        run: |
          cargo +stable build --locked --release --bin wallpaperlive
          if ($LASTEXITCODE -ne 0) { throw "build failed: $LASTEXITCODE" }
      - name: Delivery script syntax
        run: |
          foreach ($path in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Build installer
        run: |
          & .\scripts\Installer.ps1
          $hash = (Get-FileHash -LiteralPath .\dist\wallpaperlivesetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\SHA256SUMS.txt'), "$hash  wallpaperlivesetup.exe`n", [Text.Encoding]::ASCII)
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallpaperlive-windows-x64
          path: |
            dist/wallpaperlivesetup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wallpaperlive-windows-x64
          path: dist
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $hash = (Get-FileHash -LiteralPath .\dist\wallpaperlivesetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "$hash  wallpaperlivesetup.exe"
          if ((Get-Content -LiteralPath .\dist\SHA256SUMS.txt -Raw).Trim() -ne $expected) { throw 'Installer checksum mismatch.' }
          $notes = @"
          Windows x64 installer built by GitHub Actions after formatting, lint, tests and release compilation passed.

          Features: automatic display-sized SDR video cache without changing originals; manual 24/30/45/60 FPS cap; detected dedicated GPU preference; folder/subfolder import and folder filter; Select all plus confirmed mass library removal.
          FPS changes now update a native filter on the running player without reload or re-encoding. Original media starts immediately while a fixed source-rate display cache is prepared in the background; uncached 4K can temporarily use more RAM. The same renderer is reused on switches.
          Pause keeps the last frame and decoder visible, stops animation/audio, drops thumbnails and requests a one-shot resident RAM trim. Resume does not re-prepare or reload the active file. Fullscreen and maximized foreground apps on the wallpaper display trigger automatic pause, and cache conversion is cancelled/deferred while paused.
          Tray context menus follow the Windows system dark/light theme without restart; high-contrast mode retains native system rendering.
          The app checks GitHub once in the background per process for a newer stable release. A tray balloon and Pembaruan tersedia (vX.Y.Z) menu entry open the validated repository release page; no automatic download or installation.
          RAM is not globally capped. UI/tray/resume detection still use resources; cache conversion is CPU/disk work performed once per profile. HDR and animated images retain their original media in this version.

          Unsigned build. Setup reuses a matching installed decoder or a checksum-verified mpv-dev.7z beside the installer without Internet access. Otherwise it asks for a one-time decoder download. No wallpaper or startup setting is applied by Setup.
          Installation, desktop playback and resource use still require manual testing. Use trusted local media; do not disable security protections or run as administrator to bypass warnings.

          SHA256: $hash
          Build: https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID
          "@
          $notes | Set-Content -LiteralPath .\dist\release-notes.md -Encoding utf8
          $arguments = @('release', 'create', $env:RELEASE_TAG, '.\dist\wallpaperlivesetup.exe', '.\dist\SHA256SUMS.txt', '--verify-tag', '--draft', '--title', "WallpaperLive $env:RELEASE_TAG", '--notes-file', '.\dist\release-notes.md')
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += @('--prerelease', '--latest=false') }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed: $LASTEXITCODE" }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed: $LASTEXITCODE" }
